name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Users run this on their own laptops. Windows defaults to cp1252
          # for text files (until Python 3.15), and Airbnb listing names are
          # full of emoji, so Windows gets a real run rather than an
          # assumption. 3.14 is what a fresh python.org download installs.
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # No API keys are configured here on purpose: the suite must stay
      # hermetic. Any test that reaches the network will fail this job.
      #
      # The suite runs against real AirROI responses captured in
      # tests/fixtures/ (~1.6 MB across six markets). Those are committed
      # deliberately — regression tests for the scorer are only worth
      # anything against payloads the API actually returns. They are static
      # JSON, so they cost nothing at runtime and need no credentials.
      - name: Test (pytest)
        run: pytest -q

  # The job above hands pytest a Python that setup-python installed. Users get
  # none: they run the desktop app, and scripts/ensure_env.sh must install uv,
  # download Python and the dependencies by itself. This proves that on
  # brand-new machines, with the runner's own Python and uv taken off PATH.
  fresh-machine:
    name: fresh machine setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash   # Git Bash on Windows: what Claude Code's Bash tool runs
    steps:
      - uses: actions/checkout@v4

      - name: Hide the runner's Python and uv
        run: |
          keep=""
          IFS=':' read -ra parts <<< "$PATH"
          for p in "${parts[@]}"; do
            if ls "$p"/python* "$p"/python*.exe "$p"/uv "$p"/uv.exe >/dev/null 2>&1; then
              case "$p" in /usr/bin|/bin|/c/Windows*|/c/WINDOWS*) keep="$keep:$p" ;; *) echo "hiding $p" ;; esac
            else
              keep="$keep:$p"
            fi
          done
          echo "CLEAN_PATH=${keep#:}" >> "$GITHUB_ENV"

      - name: First run installs everything (uv, Python 3.13, dependencies)
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          export PATH="$CLEAN_PATH"
          command -v uv && { echo "::error::uv still visible"; exit 1; } || true
          PY="$(bash scripts/ensure_env.sh --dev)"
          "$PY" --version
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Second run is the fast path
        run: |
          export PATH="$CLEAN_PATH"
          out="$(bash scripts/ensure_env.sh --dev 2>&1 >/dev/null)"
          [ -z "$out" ] || { echo "::error::second run reinstalled: $out"; exit 1; }

      - name: The skill's command form, setup.py through a pipe, stdin at EOF
        run: |
          export PATH="$CLEAN_PATH"
          PY="$(bash scripts/ensure_env.sh)" && "$PY" agent.py --help | head -3
          "$PY" setup.py < /dev/null > setup.out 2>&1 || true
          ! grep -q Traceback setup.out || { cat setup.out; exit 1; }
          rm -f .env

      - name: Full test suite with the Python the script built
        run: |
          export PATH="$CLEAN_PATH"
          "$PY" -m pytest -q
          "$PY" -m ruff check .

  secrets-guard:
    name: no secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo is public and the whole design is "bring your own keys".
      # A committed .env or branding.json is the one mistake that cannot be
      # undone by a later commit, so fail the build rather than merge it.
      - name: Assert no local config is tracked
        run: |
          tracked=$(git ls-files -- '.env' '.env.*' 'branding.json' \
                    | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::These files must never be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "OK - no .env or branding.json tracked."

  package:
    name: distribution zip builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # scripts/package.py sources its manifest from `git ls-files`, so this
      # also proves the published file set is what we think it is.
      - name: Build the zip
        run: python scripts/package.py
